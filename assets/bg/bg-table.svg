<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2d5a3d"/>
      <stop offset="100%" stop-color="#1a3d2a"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="900" height="600" fill="url(#bgGrad)"/>
  <!-- 装饰线 -->
  <circle cx="450" cy="300" r="180" fill="none" stroke="#3d7a52" stroke-width="3" opacity="0.5"/>
  <circle cx="450" cy="300" r="160" fill="none" stroke="#3d7a52" stroke-width="2" opacity="0.3"/>
  <!-- 角落装饰 -->
  <rect x="30" y="30" width="100" height="60" rx="8" fill="none" stroke="#cfb53b" stroke-width="2" opacity="0.4"/>
  <rect x="770" y="30" width="100" height="60" rx="8" fill="none" stroke="#cfb53b" stroke-width="2" opacity="0.4"/>
  <rect x="30" y="510" width="100" height="60" rx="8" fill="none" stroke="#cfb53b" stroke-width="2" opacity="0.4"/>
  <rect x="770" y="510" width="100" height="60" rx="8" fill="none" stroke="#cfb53b" stroke-width="2" opacity="0.4"/>
  <!-- 中心文字 -->
  <text x="450" y="295" text-anchor="middle" font-size="24" fill="#cfb53b" opacity="0.6" font-weight="bold">BLACKJACK</text>
  <text x="450" y="325" text-anchor="middle" font-size="16" fill="#cfb53b" opacity="0.4">21</text>
</svg>
